name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
      id-token: write   # codecov: mint the OIDC token it uploads with (no repo secret needed)
    strategy:
      fail-fast: false
      # Explicit combinations, not a cross-product: the two platforms need different arches
      # (macos-latest runners are Apple silicon), and `deps/build.jl` fetches the matching
      # gmtvtk-macos-arm64 / gmtvtk-linux-x86_64 asset from the dll-latest release for each.
      matrix:
        include:
          - {version: '1.10', os: ubuntu-latest, arch: x64}
          - {version: 'pre',  os: ubuntu-latest, arch: x64}
          - {version: '1.10', os: macos-latest,  arch: aarch64}
          - {version: 'pre',  os: macos-latest,  arch: aarch64}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # A runner has no display, and the viewer is a Qt application: any test that reaches a
      # QApplication dies with `qFatal: could not connect to display` -> SIGABRT, taking the whole
      # suite with it. Xvfb is a real (virtual) X server, so Qt gets a display and VTK gets GL
      # through Mesa's software rasteriser.
      #
      # libxcb-cursor0 is NOT optional: since Qt 6.5 the xcb platform plugin refuses to load without
      # it, and it is a SYSTEM library — the runtime bundle ships the rest of libxcb but not that one,
      # which is why the plugin was "found" and still failed.
      # Linux only: macOS has Cocoa, so Qt gets a platform plugin without any of this.
      - name: Virtual display + the Qt/GL system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libgl1 libglx0 libegl1 libopengl0 libglu1-mesa
      - uses: julia-actions/julia-buildpkg@v1
      # GMT picks its FFT backend at runtime, and on Apple silicon it picks Accelerate's vDSP —
      # which SEGFAULTS (signal 11) inside vDSP_fft2d_zip, killing the whole test process:
      #     vDSP_fft2d_zip (libvDSP.dylib) <- gmtfft_2d_vDSP <- GMT_FFT_2D (libgmt.6.7.0.dylib)
      # That is a bug in GMT's C library, not in anything here, and no test can survive it. FFTW3f
      # is linked into the same GMT_jll, handles any transform length and gives the same answers, so
      # the runner is told to use it. Remove this once GMT's vDSP path is fixed upstream.
      #
      # NOT KissFFT, which this step selected first: that swapped the segfault for `signal (6):
      # Abort trap` (run 33657361347). The jll is built `-fopenmp=libomp`, kiss_fft.c's kf_work runs
      # a `#pragma omp parallel for`, and kissfft is the only backend that reaches it -- so it put a
      # second OpenMP runtime inside a Julia process that already has one. Details in test/runtests.jl.
      #
      # GMT must WRITE this file itself. A hand-written one is refused —
      #     GMT [WARNING]: Your gmt.conf file (~/.gmt/gmt.conf) may not be GMT 6 compatible
      # — and a refused file means the setting is ignored and vDSP crashes anyway (that is exactly
      # what happened on the first attempt). `gmtset` writes gmt.conf into the current directory, so
      # it is run from ~/.gmt, which is where GMT looks for a user's defaults. It runs AFTER
      # buildpkg because `using GMT` needs the project's dependencies installed.
      - name: Use GMT's FFTW backend (its vDSP path crashes on arm64)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/.gmt
          cd ~/.gmt && julia --project=${{ github.workspace }} -e 'using GMT; GMT.gmt("gmtset GMT_FFT fftw")'
          echo "--- ~/.gmt/gmt.conf ---"; grep GMT_FFT ~/.gmt/gmt.conf
      # `prefix` runs the test process under Xvfb; INTERACTIVEGMT_TEST_GUI turns on the :gui tier
      # (test/runtests.jl), which is ~69 testitems that open REAL windows and were skipped here
      # until now — the reason the GUI half of the package had no coverage at all.
      - uses: julia-actions/julia-runtest@v1
        with:
          # Xvfb wraps the test process on Linux; on macOS there is nothing to wrap.
          prefix: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
        env:
          INTERACTIVEGMT_TEST_GUI: '1'
      - uses: julia-actions/julia-processcoverage@v1
      # Coverage was being COLLECTED and then thrown away: this repo has no CODECOV_TOKEN secret, the
      # action fell back to a tokenless upload, and Codecov answered
      #     Upload queued for processing failed: {"message":"Token required - not valid tokenless upload"}
      # while the job stayed green, because fail_ci_if_error was false. Nothing ever reached
      # app.codecov.io/gh/GenericMappingTools/InteractiveGMT.
      #
      # `use_oidc` uploads with the GitHub OIDC token the runner already mints (the `id-token: write`
      # permission above) instead of a shared secret — nothing to store, nothing to rotate, and it
      # works on forks. `token:` stays as the fallback for the day someone does add the secret.
      # fail_ci_if_error is TRUE now: an upload that is refused is a failure and must say so, not sit
      # behind a green tick.
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
